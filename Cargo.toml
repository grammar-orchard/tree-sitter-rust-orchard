[package]
name = "tree-sitter-rust-orchard"
description = "Grammar for Rust that aims to be closer to the actual AST"
version = "0.16.11"
authors = ["Maxim Sokolov <maxim0xff@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "rust-orchard"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://codeberg.org/grammar-orchard/tree-sitter-rust-orchard"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.12"
